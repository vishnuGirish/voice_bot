databases:
  - name: digitalize-db
    plan: free
    databaseName: digitalize
    user: digitalize

services:
  - type: web
    name: digitalize
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /login
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: digitalize-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: NODE_ENV
        value: production
